name: Build Android 4.19 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex libssl-dev libelf-dev \
          crossbuild-essential-arm64 crossbuild-essential-armhf bc rsync \
          git wget ccache python3 clang lld

    - name: Fetch Android Clang Toolchain (r383902 / Clang 11.0.1)
      run: |
        mkdir -p clang-toolchain
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --branch android-11.0.0_r1 clang-toolchain

    - name: Clone Kernel Source
      run: |
        git clone https://android.googlesource.com/kernel/common --branch deprecated/android-4.19-stable --depth=1 kernel-source

    - name: Inject Custom Configuration
      run: |
        mkdir -p kernel-source/arch/arm64/configs
        cp custom_defconfig kernel-source/arch/arm64/configs/custom_defconfig

    - name: Compile Kernel
      run: |
        cd kernel-source
        
        # Environment setup for Clang cross-compilation
        export PATH="$(pwd)/../clang-toolchain/clang-r383902/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # Generate configuration and build
        make O=out custom_defconfig
        make O=out -j$(nproc)

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Kernel-Image
        path: |
          kernel-source/out/arch/arm64/boot/Image.gz
          kernel-source/out/arch/arm64/boot/Image.gz-dtb
          kernel-source/out/arch/arm64/boot/dtbo.img
